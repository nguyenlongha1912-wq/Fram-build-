name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giai nen
        run: unzip -q farmbuild.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build
        working-directory: farmbuild
        run: |
          set +e
          gradle build --no-daemon --stacktrace > ../build.log 2>&1
          code=$?
          {
            echo '### Loi build (rut gon)'
            echo '```'
            grep -E "error:|What went wrong|Execution failed|Caused by" -A3 ../build.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:" -A2 ../build.log | head -60
          exit $code

      - name: Gom file mod
        run: |
          mkdir -p out
          cp farmbuild/build/libs/farmbuild-*.jar out/
          cp farmbuild/libs/baritone-api-fabric-1.17.0.jar out/

      - uses: actions/upload-artifact@v4
        with:
          name: farmbuild-mods
          path: out/*.jar
